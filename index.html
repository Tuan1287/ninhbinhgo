<body>

<header>
  <div class="header-left">
    <div class="brand" onclick="resetChat()">
      <span class="brand-name">Ninh Bình AI</span>
      <span class="brand-tag" id="brandTag"></span>
    </div>
    <div id="weatherPill" title="Thời tiết Ninh Bình hiện tại">
      <span id="weatherIcon">⏳</span>
      <span id="weatherTemp">--°C</span>
      <span id="weatherDesc"></span>
    </div>
  </div>
  <div class="header-right">
    <span id="disclaimer"></span>
    <button class="icon-btn" id="clearBtn" onclick="clearChat()">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/>
      </svg>
    </button>
    <button class="icon-btn" id="keyBtn" onclick="resetKey()">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="8" cy="15" r="3"/><path d="M11 15h9"/><path d="M17 12l3 3-3 3"/>
      </svg>
    </button>
    <button id="langBtn" onclick="toggleLang()">EN</button>
  </div>
  <div id="turnBar"><div id="turnBarFill"></div></div>
</header>

<div class="topics-wrap">
  <nav class="topics" id="topicsNav"></nav>
  <span class="scroll-hint" id="scrollHint">
    <svg viewBox="0 0 24 24" fill="none" stroke="#888884" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 18 15 12 9 6"/>
    </svg>
  </span>
</div>

<div id="msgWrap">
<button id="scrollBtn" onclick="scrollToBottom()" title="Xuống cuối">↓</button>
<div id="messages">
  <div class="welcome" id="welcome">
    <div class="welcome-body">
      <!-- Cột trái: heading + suggestions -->
      <div class="welcome-left">
        <h1 class="welcome-heading" id="welcomeHeading"></h1>
        <p class="welcome-sub" id="welcomeSub"></p>
        <div class="suggestions" id="sugGrid"></div>
      </div>
      <!-- Cột phải: planner form -->
      <div class="planner" id="plannerPanel">
        <div class="planner-title" id="plannerTitle">✦ Tư vấn theo nhu cầu</div>
        <div class="planner-fields">
          <div class="pfield">
            <label id="pLabelPeople">👥 Số người</label>
            <div class="pchips" id="pPeople">
              <button class="pchip active" data-val="1">1</button>
              <button class="pchip" data-val="2">2</button>
              <button class="pchip" data-val="3">3</button>
              <button class="pchip" data-val="4">4</button>
            </div>
          </div>
          <div class="pfield">
            <label id="pLabelDays">📅 Số ngày</label>
            <div class="pchips" id="pDays">
              <button class="pchip active" data-val="1">1 ngày</button>
              <button class="pchip" data-val="2">2N1Đ</button>
              <button class="pchip" data-val="3">3N2Đ</button>
            </div>
          </div>
          <div class="pfield">
            <label id="pLabelStyle">🎯 Mục tiêu</label>
            <div class="pchips multi" id="pStyle">
              <button class="pchip" data-val="kham-pha">🏞️ Khám phá</button>
              <button class="pchip" data-val="nghi-duong">🧘 Nghỉ dưỡng</button>
              <button class="pchip" data-val="am-thuc">🍜 Ẩm thực</button>
              <button class="pchip" data-val="check-in">📸 Check-in</button>
            </div>
          </div>
          <div class="pfield">
            <label id="pLabelArea">📍 Khu vực ưu tiên</label>
            <div class="pchips multi" id="pArea">
              <button class="pchip" data-val="trang-an">Tràng An</button>
              <button class="pchip" data-val="tam-coc">Tam Cốc</button>
              <button class="pchip" data-val="bai-dinh">Bái Đính</button>
              <button class="pchip" data-val="pho-co">Phố cổ</button>
            </div>
          </div>
          <div class="pfield">
            <label id="pLabelTransport">🚗 Phương tiện</label>
            <div class="pchips" id="pTransport">
              <button class="pchip active" data-val="xe-may">🏍️ Xe máy</button>
              <button class="pchip" data-val="o-to">🚗 Ô tô</button>
              <button class="pchip" data-val="xe-khach">🚌 Xe khách</button>
              <button class="pchip" data-val="tau">🚂 Tàu</button>
            </div>
          </div>
          <div class="pfield">
            <label id="pLabelBudget">💰 Ngân sách/người</label>
            <div class="pchips" id="pBudget">
              <button class="pchip" data-val="<1tr">&lt;1 triệu</button>
              <button class="pchip active" data-val="1-2tr">1–2 triệu</button>
              <button class="pchip" data-val="2-5tr">2–5 triệu</button>
              <button class="pchip" data-val=">5tr">5tr+</button>
            </div>
          </div>
        </div>
        <button class="planner-btn" id="plannerBtn" onclick="submitPlanner()">
          Tư vấn cho tôi →
        </button>
      </div>
    </div>
  </div>
</div>
</div>

<div class="api-notice" id="apiSetup">
  <p id="apiText"></p>
  <div class="key-row">
    <input type="password" id="apiKeyInput" placeholder="AIzaSy..."/>
    <button id="apiConnectBtn" onclick="saveKey()"></button>
  </div>
</div>

<div class="input-area">
  <div class="input-row">
    <textarea id="userInput" rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button id="sendBtn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
  <p class="hint" id="hintText"></p>
  <p class="turn-counter" id="turnCounter"></p>
</div>

<div id="mapModal">
  <div class="map-panel">
    <div class="map-header">
      <h3 id="mapTitle"></h3>
      <button class="map-close" onclick="closeMap()">✕</button>
    </div>
    <div id="map"></div>
    <div class="map-legend">
      <span class="legend-item"><span class="legend-dot" style="background:#ef4444"></span> Tham quan</span>
      <span class="legend-item"><span class="legend-dot" style="background:#3b82f6"></span> Lưu trú</span>
      <span class="legend-item"><span class="legend-dot" style="background:#f59e0b"></span> Ăn uống</span>
      <span class="legend-item"><span class="legend-dot" style="background:#10b981"></span> Mua sắm</span>
    </div>
  </div>
</div>

<!-- Thứ tự load quan trọng: dữ liệu trước, logic sau -->
<script src="i18n.js"></script>
<script src="khudiem.js"></script>
<script src="khoangcach.js"></script>
<script src="luutru.js"></script>
<script src="nhahang.js"></script>
<script src="anvat.js"></script>
<script src="cafe.js"></script>
<script src="places.js"></script>
<script src="system.js"></script>

<script src="app.js"></script>
</body>
</html>
